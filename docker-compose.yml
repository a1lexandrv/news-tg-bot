services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-news-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ainews
      POSTGRES_PASSWORD: ainews
      POSTGRES_DB: ainews
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ainews -d ainews']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
